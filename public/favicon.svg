<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="2" fill="#07080c"/>
  <!-- Pixel Tail Feathers -->
  <rect x="6" y="1" width="4" height="2" fill="#dc2626"/>
  <rect x="4" y="2" width="2" height="2" fill="#ea580c"/>
  <rect x="10" y="2" width="2" height="2" fill="#ea580c"/>
  <rect x="2" y="4" width="2" height="3" fill="#f59e0b"/>
  <rect x="12" y="4" width="2" height="3" fill="#f59e0b"/>
  <rect x="1" y="7" width="2" height="3" fill="#991b1b"/>
  <rect x="13" y="7" width="2" height="3" fill="#991b1b"/>
  <rect x="3" y="3" width="10" height="6" fill="#7c2d12"/>
  <rect x="2" y="6" width="12" height="4" fill="#9a3412"/>
